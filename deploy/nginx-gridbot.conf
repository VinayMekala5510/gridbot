# /etc/nginx/sites-available/gridbot — HTTPS reverse proxy in front of the app (127.0.0.1:3000).
# Installed by scripts/setup-nginx.sh. Certificate files: /etc/nginx/ssl/gridbot.{crt,key}

limit_req_zone $binary_remote_addr zone=gridbot_login:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt HTTP-01 challenges
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/gridbot.crt;
    ssl_certificate_key /etc/nginx/ssl/gridbot.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:gridbot_ssl:5m;
    server_tokens off;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 64k;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location = /api/login {
        limit_req zone=gridbot_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # Live dashboard feed (server-sent events): no buffering, long-lived.
    location = /api/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
